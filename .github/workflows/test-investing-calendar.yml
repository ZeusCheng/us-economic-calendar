name: Test Investing Economic Calendar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-investing:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Test Investing.com calendar endpoint
        run: python scripts/test_investing_calendar.py
